name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Disambiguate wizard navigation in E2E
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/journey.spec.ts')
          text = path.read_text()
          old = "getByRole('button', { name: 'Next' })"
          new = "getByRole('button', { name: 'Next', exact: true })"
          updated = text.replace(old, new)
          if updated != text:
              path.write_text(updated)
          PY
          if ! git diff --quiet -- e2e/journey.spec.ts; then
            git add e2e/journey.spec.ts
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "test: disambiguate wizard next navigation"
            git push origin HEAD:agent/target-measurements-table-premium
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -e packages/python/topographic-adjustment-core
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:python
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
