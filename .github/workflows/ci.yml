name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -e packages/python/topographic-adjustment-core
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:python
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright with diagnostics
        id: e2e
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-active-table
          path: |
            e2e.log
            test-results
            playwright-report
          if-no-files-found: warn
      - name: Fail when Playwright fails
        if: steps.e2e.outcome == 'failure'
        run: exit 1
