name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload editable source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: targets-table-source
          path: |
            src/features/create/LegacyWizardPage.tsx
            e2e
            src/features/create/__tests__
          if-no-files-found: warn
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -e packages/python/topographic-adjustment-core
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:python
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
