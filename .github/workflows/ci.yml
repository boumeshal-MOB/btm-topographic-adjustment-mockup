name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Apply staged target table refactor
        if: ${{ github.event_name == 'pull_request' && hashFiles('src/features/create/target-table-view-model.ts') == '' }}
        run: |
          cat .automation/target-table-patch/part-* | base64 -d > /tmp/target-table.patch
          git apply --index /tmp/target-table.patch
          git rm -r .automation/target-table-patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: compact target measurement setup"
          git push origin HEAD:agent/target-measurements-table-premium
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -e packages/python/topographic-adjustment-core
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:python
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
