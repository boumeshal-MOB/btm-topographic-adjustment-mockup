name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Install active target table refactor
        if: ${{ github.event_name == 'pull_request' && hashFiles('.automation/actual-targets-step/part-*') != '' }}
        shell: bash
        run: |
          cat .automation/actual-targets-step/part-* | base64 -d > src/features/create/TargetsAndNetworkStep.tsx
          git rm -r .automation/actual-targets-step
          git fetch origin main
          git checkout origin/main -- src/features/create/LegacyWizardPage.tsx
          git add src/features/create/TargetsAndNetworkStep.tsx src/features/create/LegacyWizardPage.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: compact active target measurement table"
          git push origin HEAD:agent/target-measurements-table-premium
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -e packages/python/topographic-adjustment-core
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:python
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
